name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Build MCP server
      run: npm run build --workspace fp-conv-mcp

    - name: Run MCP server tests
      run: npm test --workspace fp-conv-mcp

    - name: Build CLI
      run: npm run build --workspace fp-conv-cli

    - name: Run CLI tests
      run: npm test --workspace fp-conv-cli

  oracle:
    # The Python oracle regenerates the committed IEEE 754 ground-truth vectors;
    # fail if they have drifted from what the library is validated against.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Regenerate oracle vectors and check for drift
      run: |
        python3 tests/oracle-validator.py > /tmp/oracle-vectors.json
        if ! diff -u tests/oracle-vectors.json /tmp/oracle-vectors.json; then
          echo "::error::tests/oracle-vectors.json is out of date. Run 'npm run oracle:regen' and commit the result."
          exit 1
        fi
