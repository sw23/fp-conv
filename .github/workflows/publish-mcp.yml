name: Publish fp-conv-mcp

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # Only react to this package's release tags (e.g. mcp-v1.0.2) so a release
    # for another package does not trigger an MCP publish. Manual
    # workflow_dispatch runs are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24.5.0+ bundles npm >= 11.5.1, required for OIDC trusted
          # publishing. Pinned for reproducible release builds
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#mcp-v}"
          PKG_VERSION="$(node -p "require('./packages/fp-conv-mcp/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' (version '$TAG_VERSION') does not match fp-conv-mcp package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "Tag version '$TAG_VERSION' matches package version '$PKG_VERSION'."

      - name: Build MCP server
        run: npm run build --workspace fp-conv-mcp

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: |
          npm run test:coverage
          npm test --workspace fp-conv-mcp

      - name: Smoke-test built artifact
        # Every test imports from src/; exercise the bundled dist/ that actually
        # ships by driving a real JSON-RPC session over stdio before publishing.
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node packages/fp-conv-mcp/dist/index.js > /tmp/mcp-smoke.txt
          node -e 'const fs=require("fs");const lines=fs.readFileSync("/tmp/mcp-smoke.txt","utf8").trim().split("\n").filter(Boolean);const last=JSON.parse(lines[lines.length-1]);if(!last.result||!Array.isArray(last.result.tools)||last.result.tools.length===0){throw new Error("tools/list response malformed");}console.log("MCP artifact smoke test passed:",last.result.tools.length,"tools");'

      - name: Publish to npm
        # Authentication and provenance are handled automatically via OIDC
        # trusted publishing (see Settings > Trusted Publishing on npmjs.com).
        run: npm publish --workspace fp-conv-mcp --access public
