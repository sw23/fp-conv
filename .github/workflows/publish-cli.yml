name: Publish fp-conv-cli

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Only react to this package's release tags (e.g. cli-v1.0.1) so a release
    # for another package does not trigger a CLI publish. Manual
    # workflow_dispatch runs are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24.5.0+ bundles npm >= 11.5.1, required for OIDC trusted
          # publishing. Pinned for reproducible release builds
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache: a cache written by another workflow run must
          # not be able to change what gets published.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG#cli-v}"
          PKG_VERSION="$(node -p "require('./packages/fp-conv-cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' (version '$TAG_VERSION') does not match fp-conv-cli package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "Tag version '$TAG_VERSION' matches package version '$PKG_VERSION'."

      - name: Build CLI
        run: npm run build --workspace fp-conv-cli

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: |
          npm run test:coverage
          npm test --workspace fp-conv-cli

      - name: Smoke-test built artifact
        # Every test imports from src/; exercise the bundled dist/ that actually
        # ships before publishing.
        run: |
          node packages/fp-conv-cli/dist/index.js --version
          node packages/fp-conv-cli/dist/index.js convert 3.14 --from fp32 --to fp16 --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{JSON.parse(s);console.log("CLI artifact smoke test passed");});'

      - name: Publish to npm
        # Authentication and provenance are handled automatically via OIDC
        # trusted publishing (see Settings > Trusted Publishing on npmjs.com).
        run: npm publish --workspace fp-conv-cli --access public
